name: FC Lionem Daten aktualisieren

on:
  schedule:
    # Stündlich zur vollen Stunde (UTC!). CH-Zeit im Sommer = UTC+2, im Winter UTC+1.
    - cron: "0 * * * *"
  workflow_dispatch: {}   # erlaubt manuelles Starten über den "Run workflow"-Knopf

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: pip install requests beautifulsoup4

      - name: Daten scrapen
        run: python scrape.py

      - name: Änderungen committen
        run: |
          git config user.name "fc-lionem-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json processed_telegrams.json
          git diff --quiet --cached || git commit -m "Daten aktualisiert: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
