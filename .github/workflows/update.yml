name: FC Lionem Daten aktualisieren

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: |
          pip install beautifulsoup4 playwright
          playwright install --with-deps chromium

      - name: Daten scrapen
        env:
          DEBUG: "1"
        run: python scrape.py

      - name: Änderungen committen
        run: |
          git config user.name "fc-lionem-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json processed_telegrams.json
          git add debug_*.txt 2>/dev/null || true
          git diff --quiet --cached || git commit -m "Daten aktualisiert: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
